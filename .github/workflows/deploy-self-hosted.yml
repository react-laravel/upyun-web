name: Deploy Upyun Web to B

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      validate_only:
        description: Verify the current B service without uploading code
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-upyun-web-b
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.16.0'
      - name: Build locked frontend and minimal runtime
        if: github.event_name == 'push' || inputs.validate_only != true
        run: |
          npm ci
          npm test
          npm run build
          node scripts/runtime-dependencies.mjs > "$RUNNER_TEMP/upyun-dependencies-$GITHUB_SHA.json"
          python3 scripts/package-runtime.py "$RUNNER_TEMP/upyun-web-$GITHUB_SHA.tar.gz" "$RUNNER_TEMP/upyun-dependencies-$GITHUB_SHA.json" "$GITHUB_SHA"
      - name: Publish or validate B
        env:
          B_UPYUN_DEPLOY_SSH_KEY: ${{ secrets.B_UPYUN_DEPLOY_SSH_KEY }}
          B_UPYUN_DEPLOY_KNOWN_HOSTS: ${{ secrets.B_UPYUN_DEPLOY_KNOWN_HOSTS }}
          VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only == true }}
        run: bash scripts/deploy-upyun-to-b.sh "$RUNNER_TEMP/upyun-web-$GITHUB_SHA.tar.gz" "$GITHUB_SHA"
      - name: Remove runtime and dependency metadata
        if: always()
        run: rm -f "$RUNNER_TEMP/upyun-web-$GITHUB_SHA.tar.gz" "$RUNNER_TEMP/upyun-dependencies-$GITHUB_SHA.json"
